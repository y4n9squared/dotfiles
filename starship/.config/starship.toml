format = """
$python\
$git_branch\
$git_state\
$line_break\
$cmd_duration\
$character"""

[git_branch]
format = '[$symbol$branch(:$remote_branch)]($style) '

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"
min_time = 100
show_milliseconds = true

[python]
symbol = ""
# format = '[$symbol${version} (\($virtualenv\) )]($style) '
format = '[($symbol $virtualenv)]($style) '
style = "yellow"
