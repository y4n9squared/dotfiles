add_newline = false

format = """

$python\
$git_branch\
$git_state\
$line_break\
$cmd_duration\
$character"""

[profiles]
claude-code = "$claude_model[| ](bright-black)$claude_context[| ](bright-black)$git_branch[| ](bright-black)$claude_cost[| ](bright-black)$directory"

[claude_model]
format = '[$model]($style)[( \($effort\))](bright-black) '
style = "cyan"

[claude_context]
format = '[$percentage]($style) '

[[claude_context.display]]
threshold = 0
style = "bright-black"

[claude_cost]
format = '[\$$cost]($style) '

[[claude_cost.display]]
threshold = 0.0
style = "green"

[directory]
style = "blue"
truncation_length = 4
truncate_to_repo = false

[git_branch]
format = '[$symbol$branch(:$remote_branch)]($style) '

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"
min_time = 100
show_milliseconds = true

[python]
symbol = ""
# format = '[$symbol${version} (\($virtualenv\) )]($style) '
format = '[($symbol $virtualenv)]($style) '
style = "yellow"
